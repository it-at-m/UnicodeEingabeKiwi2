name: Release NPM

on:
  workflow_dispatch:
    inputs:
      release-version:
        type: choice
        description: "Select version increment type (follows Semantic Versioning)"
        required: true
        options:
          - patch
          - minor
          - major
      skip-deployment:
        default: true
        type: boolean
        description: "skip deployment to npm registry"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      # action-npm-release runs `npm version` before `git config`. These keep
      # that step from failing, and stop npm from committing so the action's
      # follow-up commit is not a no-op.
      HUSKY: "0"
      npm_config_git_tag_version: "false"
      GIT_AUTHOR_NAME: GitHub Actions
      GIT_AUTHOR_EMAIL: github-actions@github.com
      GIT_COMMITTER_NAME: GitHub Actions
      GIT_COMMITTER_EMAIL: github-actions@github.com
    outputs:
      ARTIFACT_NAME: ${{ steps.node.outputs.artifact-name }}
      ARTIFACT_VERSION: ${{ steps.npm_release.outputs.ARTIFACT_VERSION }}
    steps:
      - id: npm_release
        uses: it-at-m/lhm_actions/action-templates/actions/action-npm-release@e9a8422d740d4e9eaef25cfeeb3a5790da97a7aa # v1.2.4
        with:
          app-path: "" # root package.json
          node-version: "24"
          releaseVersion: ${{ inputs.release-version }}
      - id: node
        uses: it-at-m/lhm_actions/action-templates/actions/action-npm-build@e9a8422d740d4e9eaef25cfeeb3a5790da97a7aa # v1.2.4
        with:
          app-path: ""
          node-version: "24"
      - if: ${{ !inputs.skip-deployment }}
        shell: bash
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-image:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      packages: write
      contents: read
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-build-image@e9a8422d740d4e9eaef25cfeeb3a5790da97a7aa # v1.2.4
        with:
          path: ""
          image-name: kiwi
          artifact-name: ${{ needs.release.outputs.ARTIFACT_NAME }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          registry-username: ${{ github.actor }}
          image-tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.ARTIFACT_VERSION }}
            type=raw,value=latest

  create-github-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: it-at-m/lhm_actions/action-templates/actions/action-create-github-release@e9a8422d740d4e9eaef25cfeeb3a5790da97a7aa # v1.2.4
        with:
          artifact-name: ${{ needs.release.outputs.ARTIFACT_NAME }}
          tag-name: ${{ needs.release.outputs.ARTIFACT_VERSION }}

  # GITHUB_TOKEN-created releases do not trigger workflow `release` events, so notify
  # explicitly after the GitHub release exists.
  notify-webex:
    needs:
      - release
      - create-github-release
    uses: ./.github/workflows/release-webex-notify.yml
    with:
      version: ${{ needs.release.outputs.ARTIFACT_VERSION }}
    secrets:
      WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
      WEBEX_ROOM_ID: ${{ secrets.WEBEX_ROOM_ID }}
