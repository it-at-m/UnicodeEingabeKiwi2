name: Release NPM

on:
  workflow_dispatch:
    inputs:
      release-version:
        type: choice
        description: "Select version increment type (follows Semantic Versioning)"
        required: true
        options:
          - patch
          - minor
          - major
      skip-deployment:
        default: true
        type: boolean
        description: "skip deployment to npm registry"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      ARTIFACT_NAME: ${{ steps.node.outputs.artifact-name }}
      ARTIFACT_VERSION: ${{ steps.npm_release.outputs.ARTIFACT_VERSION }}
    steps:
      # action-npm-release pushes the bump to the workflow branch. `dev` only
      # allows the Kiwi team to push, so GitHub Actions is rejected. Bump on a
      # release branch and open a PR instead.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.19.0"
          cache: npm
      - id: npm_release
        name: Bump version and open PR
        env:
          GH_TOKEN: ${{ github.token }}
          HUSKY: "0"
          RELEASE_VERSION: ${{ inputs.release-version }}
          BASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          NEW_VERSION="$(npm version "$RELEASE_VERSION" --no-git-tag-version)"
          echo "ARTIFACT_VERSION=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          git add package.json package-lock.json
          git commit -m "chore(GH): bump version to ${NEW_VERSION}"
          BRANCH="release/${NEW_VERSION}"
          git switch -c "$BRANCH"
          git push -u origin "HEAD:refs/heads/${BRANCH}"
          gh pr create --base "$BASE_REF" --head "$BRANCH" \
            --title "chore(GH): bump version to ${NEW_VERSION}" \
            --body "Automated version bump from Release NPM."
      - id: node
        uses: it-at-m/lhm_actions/action-templates/actions/action-npm-build@e9a8422d740d4e9eaef25cfeeb3a5790da97a7aa # v1.2.4
        with:
          app-path: ""
          node-version: "24"
      - if: ${{ !inputs.skip-deployment }}
        shell: bash
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-image:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      packages: write
      contents: read
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-build-image@e9a8422d740d4e9eaef25cfeeb3a5790da97a7aa # v1.2.4
        with:
          path: ""
          image-name: kiwi
          artifact-name: ${{ needs.release.outputs.ARTIFACT_NAME }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          registry-username: ${{ github.actor }}
          image-tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.ARTIFACT_VERSION }}
            type=raw,value=latest

  create-github-release:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: it-at-m/lhm_actions/action-templates/actions/action-create-github-release@e9a8422d740d4e9eaef25cfeeb3a5790da97a7aa # v1.2.4
        with:
          artifact-name: ${{ needs.release.outputs.ARTIFACT_NAME }}
          tag-name: ${{ needs.release.outputs.ARTIFACT_VERSION }}

  # GITHUB_TOKEN-created releases do not trigger workflow `release` events, so notify
  # explicitly after the GitHub release exists.
  notify-webex:
    needs:
      - release
      - create-github-release
    uses: ./.github/workflows/release-webex-notify.yml
    with:
      version: ${{ needs.release.outputs.ARTIFACT_VERSION }}
    secrets:
      WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
      WEBEX_ROOM_ID: ${{ secrets.WEBEX_ROOM_ID }}
