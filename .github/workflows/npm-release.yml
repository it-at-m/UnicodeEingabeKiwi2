# Workflow to release the root NPM-based application.
name: release-npm

on:
  workflow_dispatch:
    inputs:
      release-version:
        type: choice
        description: "Select version increment type (follows Semantic Versioning)"
        required: true
        options:
          - patch
          - minor
          - major

jobs:
  release-npm-artifact:
    runs-on: ubuntu-latest
    env:
      # Let the shared release action commit the version bump for its PR without
      # also creating a local Git tag. The GitHub release job creates the tag.
      NPM_CONFIG_GIT_TAG_VERSION: "false"
    permissions:
      contents: write
      pull-requests: write
    outputs:
      ARTIFACT_NAME: ${{ steps.node.outputs.artifact-name }}
      ARTIFACT_VERSION: ${{ steps.npm_release.outputs.ARTIFACT_VERSION }}
    steps:
      - id: npm_release
        name: Bump version and open PR
        uses: it-at-m/lhm_actions/action-templates/actions/action-npm-release@87a254fa39e1555ffbbc8317af71b4d5ca7d4a3b # v1.6.4
        with:
          app-path: ""
          node-version: "24.22.3"
          releaseVersion: ${{ inputs.release-version }}
          use-pr: "true"
      - id: node
        uses: it-at-m/lhm_actions/action-templates/actions/action-npm-build@87a254fa39e1555ffbbc8317af71b4d5ca7d4a3b # v1.6.4
        with:
          app-path: ""
          node-version: "24"

  release-npm-image:
    runs-on: ubuntu-latest
    needs: release-npm-artifact
    permissions:
      packages: write
      contents: read
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-build-image@87a254fa39e1555ffbbc8317af71b4d5ca7d4a3b # v1.6.4
        with:
          path: ""
          image-name: unicodeeingabekiwi2
          artifact-name: ${{ needs.release-npm-artifact.outputs.ARTIFACT_NAME }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          registry-username: ${{ github.actor }}
          image-tags: |
            type=semver,pattern={{version}},value=${{ needs.release-npm-artifact.outputs.ARTIFACT_VERSION }}
            type=raw,value=latest
          platforms: "linux/amd64,linux/arm64"

  release-npm-github:
    needs: release-npm-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: it-at-m/lhm_actions/action-templates/actions/action-create-github-release@87a254fa39e1555ffbbc8317af71b4d5ca7d4a3b # v1.6.4
        with:
          artifact-name: ${{ needs.release-npm-artifact.outputs.ARTIFACT_NAME }}
          artifact-path: ${{ needs.release-npm-artifact.outputs.ARTIFACT_NAME }}.zip
          skip-artifact-decompress: true
          tag-name: ${{ needs.release-npm-artifact.outputs.ARTIFACT_VERSION }}
          generate-release-notes: true

  # GITHUB_TOKEN-created releases do not trigger workflow `release` events, so notify
  # explicitly after the GitHub release exists.
  notify-webex:
    needs:
      - release-npm-artifact
      - release-npm-github
    uses: ./.github/workflows/release-webex-notify.yml
    with:
      version: ${{ needs.release-npm-artifact.outputs.ARTIFACT_VERSION }}
    secrets:
      WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
      WEBEX_ROOM_ID: ${{ secrets.WEBEX_ROOM_ID }}
