name: codeql

env:
  # Whether to analyze JavaScript/TypeScript/Vue code or not (only set to true if repo has Javascript/Typescript/Vue source code)
  analyze-javascript-typescript-vue: true
  # Query set to use when analyzing the source code (e.g. default, security-extended, security-and-quality)
  analysis-query: security-and-quality

on:
  pull_request:
  push:
    branches:
      - "main" # Runs on main in order to keep the regular scanning by GitHub working

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql-check-changed-files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      javascript-typescript-vue: ${{ steps.filter.outputs.javascript-typescript-vue }}
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-checkout@03f09fa81a60371c01caf1a9deada89ceebbd5e5 # v1.6.3
      - id: filter
        uses: it-at-m/lhm_actions/action-templates/actions/action-filter@03f09fa81a60371c01caf1a9deada89ceebbd5e5 # v1.6.3

  codeql-javascript-typescript-vue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    needs: codeql-check-changed-files
    if: github.ref_name == 'main' || needs.codeql-check-changed-files.outputs.javascript-typescript-vue == 'true'
    steps:
      - uses: it-at-m/lhm_actions/action-templates/actions/action-codeql@03f09fa81a60371c01caf1a9deada89ceebbd5e5 # v1.6.3
        with:
          codeql-language: javascript-typescript
          codeql-query: ${{ env.analysis-query }}
